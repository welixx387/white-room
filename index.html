<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Room</title>

<!-- Google Fonts: Manrope для текста, Instrument Serif для заголовков -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Шапка: логотип, поиск, кнопки экспорта/импорта -->
<header class="topbar">
  <div class="topbar__inner">
    <button class="brand" id="brandBtn" type="button" aria-label="На главную">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__text">White Room</span>
    </button>

    <div class="search">
      <svg class="search__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="11.2" y1="11.2" x2="15" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input type="search" id="searchInput" class="search__input" placeholder="Поиск…" aria-label="Поиск">
    </div>

    <div class="topbar__actions">
      <button class="iconbtn" id="importBtn" type="button" title="Импорт JSON" aria-label="Импорт JSON">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 2v9m0 0 3.5-3.5M9 11 5.5 7.5M3 14.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="iconbtn" id="exportBtn" type="button" title="Экспорт JSON" aria-label="Экспорт JSON">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 11V2m0 0L5.5 5.5M9 2l3.5 3.5M3 14.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
</header>

<!-- Хлебная крошка / кнопка назад, видна внутри категории -->
<div class="subbar" id="subbar" hidden>
  <button class="backbtn" id="backBtn" type="button">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Категории
  </button>
  <h1 class="subbar__title" id="categoryTitle"></h1>
</div>

<main class="main" id="mainView">
  <!-- Экран: список категорий -->
  <section class="view" id="categoriesView">
    <div class="view__head">
      <h1 class="view__title">Белый зал</h1>
      <p class="view__subtitle">Личная библиотека программ и материалов</p>
    </div>
    <div class="grid" id="categoriesGrid" role="list"></div>
    <div class="empty" id="categoriesEmpty" hidden>
      <p>Пока пусто. Создайте первую категорию.</p>
    </div>
  </section>

  <!-- Экран: программы внутри категории -->
  <section class="view" id="programsView" hidden>
    <div class="grid" id="programsGrid" role="list"></div>
    <div class="empty" id="programsEmpty" hidden>
      <p>В этой категории пока нет программ.</p>
    </div>
  </section>
</main>

<!-- Плавающая кнопка добавления -->
<button class="fab" id="fabBtn" type="button" aria-label="Добавить">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<!-- Индикатор сохранения -->
<div class="toast" id="saveToast" role="status" aria-live="polite">Сохранено ✓</div>

<!-- Модалка: создать / редактировать категорию -->
<div class="modal-backdrop" id="categoryModalBackdrop" hidden>
  <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle" id="categoryModal">
    <button class="modal__close" type="button" data-close aria-label="Закрыть">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <h2 class="modal__title" id="categoryModalTitle">Новая категория</h2>
    <form id="categoryForm" class="form">
      <label class="field">
        <span class="field__label">Название категории</span>
        <input type="text" id="categoryNameInput" class="field__input" placeholder="Например, «Программы тренировок»" required maxlength="80" autocomplete="off">
      </label>
      <div class="form__actions">
        <button type="button" class="btn btn--ghost" data-close>Отмена</button>
        <button type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Модалка: создать / редактировать программу -->
<div class="modal-backdrop" id="programModalBackdrop" hidden>
  <div class="modal modal--md" role="dialog" aria-modal="true" aria-labelledby="programModalTitle" id="programModal">
    <button class="modal__close" type="button" data-close aria-label="Закрыть">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <h2 class="modal__title" id="programModalTitle">Новая программа</h2>
    <form id="programForm" class="form">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Загрузить обложку">
        <img class="dropzone__preview" id="coverPreview" alt="" hidden>
        <div class="dropzone__hint" id="dropzoneHint">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="3" y="3" y2="25" width="22" height="22" rx="6" stroke="currentColor" stroke-width="1.4"/><circle cx="10.5" cy="11" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 20l6-6 4 4 4-5 4 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Перетащите изображение сюда<br>или нажмите, чтобы выбрать</span>
        </div>
        <button type="button" class="dropzone__remove" id="removeCoverBtn" hidden aria-label="Удалить обложку">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <input type="file" id="coverFileInput" accept="image/*" hidden>

      <label class="field">
        <span class="field__label">Название</span>
        <input type="text" id="programTitleInput" class="field__input" placeholder="Название программы" required maxlength="120" autocomplete="off">
      </label>

      <label class="field">
        <span class="field__label">Описание / текст программы</span>
        <textarea id="programDescInput" class="field__textarea" rows="8" placeholder="Текст программы…"></textarea>
      </label>

      <div class="form__actions">
        <button type="button" class="btn btn--ghost" data-close>Отмена</button>
        <button type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Модалка: просмотр программы -->
<div class="modal-backdrop" id="viewModalBackdrop" hidden>
  <div class="modal modal--lg" role="dialog" aria-modal="true" aria-labelledby="viewModalTitle" id="viewModal">
    <button class="modal__close" type="button" data-close aria-label="Закрыть">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <img class="view-cover" id="viewCoverImg" alt="" hidden>
    <div class="view-body">
      <h2 class="modal__title" id="viewModalTitle"></h2>
      <p class="view-text" id="viewModalText"></p>
    </div>
  </div>
</div>

<!-- Модалка подтверждения удаления -->
<div class="modal-backdrop" id="confirmModalBackdrop" hidden>
  <div class="modal modal--xs" role="alertdialog" aria-modal="true" aria-labelledby="confirmModalTitle" id="confirmModal">
    <h2 class="modal__title" id="confirmModalTitle">Удалить?</h2>
    <p class="confirm__text" id="confirmModalText">Это действие нельзя отменить.</p>
    <div class="form__actions">
      <button type="button" class="btn btn--ghost" data-close>Отмена</button>
      <button type="button" class="btn btn--danger" id="confirmDeleteBtn">Удалить</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
